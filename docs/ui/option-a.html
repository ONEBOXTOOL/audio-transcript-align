<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 A · 波形精修台</title>
<style>
  :root{
    --bg:#F3F0E8; --surface:#FCFAF4; --surface2:#F8F5EC; --ink:#1C221E;
    --muted:#6E6657; --faint:#9A917F; --line:#E2D8C4; --line2:#D3C6AC;
    --green:#2F5D50; --green2:#3F7A68; --mint:#DCE8E2; --amber:#C6863C;
    --red:#B3352B; --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.45 -apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--green2);outline-offset:1px}

  /* ---------- top bar ---------- */
  .top{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:18px;
    padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:11px;
    letter-spacing:1.7px;color:var(--green);white-space:nowrap}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:var(--green);
    display:grid;place-items:center;color:#fff;font-size:9px;letter-spacing:0}
  .brand .slash{color:var(--faint);font-weight:400;letter-spacing:0;margin:0 2px}
  .brand .sub{color:var(--ink);font-weight:600;letter-spacing:.8px;font-size:11.5px}
  .ep{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;white-space:nowrap;overflow:hidden}
  .ep b{font-family:Georgia,"Noto Serif SC",serif;font-size:16px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis}
  .ep span{font-size:10.5px;color:var(--faint);letter-spacing:.4px}
  .stats{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .pill{font-size:10.5px;padding:3px 8px;border-radius:99px;background:var(--surface2);
    border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
  .pill.ok{background:var(--mint);border-color:#CBE0D6;color:#1E4A3D}
  .pill.warn{background:#F7EBD8;border-color:#EAD6B4;color:#7A5322}
  .top .btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;
    padding:6px 11px;font-size:11.5px}
  .top .btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}

  /* ---------- transport ---------- */
  .transport{height:50px;flex:0 0 50px;display:flex;align-items:center;gap:12px;
    padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
  #playBtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--green);
    color:#fff;font-size:12px;display:grid;place-items:center;flex:0 0 34px}
  #playBtn:hover{background:#254b40}
  .clock{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .clock em{font-style:normal;color:var(--faint)}
  .now{flex:1;min-width:0;font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now b{color:var(--ink);font-weight:600}
  .tbtns{display:flex;align-items:center;gap:6px}
  .tbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;
    padding:5px 9px;font-size:11px;color:var(--muted)}
  .tbtn.on{background:var(--mint);border-color:#BFD8CD;color:#1E4A3D}
  select{border:1px solid var(--line);background:var(--surface);border-radius:7px;
    padding:5px 6px;font-size:11px;color:var(--ink);font-family:inherit}
  .zoom{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--faint);white-space:nowrap}
  .zoom .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .zoom .seg button{border:0;background:var(--surface);padding:4px 8px;font-size:10.5px;color:var(--muted)}
  .zoom .seg button.on{background:var(--green);color:#fff}

  /* ---------- waveform ---------- */
  .wavewrap{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
    padding:8px 20px 6px}
  #wave{display:block;width:100%;height:142px;border-radius:9px;cursor:crosshair;touch-action:none}
  .wavemeta{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:5px 2px 0;min-height:19px}
  .legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
  .legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
  .legend .hint{color:var(--faint)}
  .wavemeta .right{font-size:10px;color:var(--faint);font-family:var(--mono);white-space:nowrap}

  /* ---------- main ---------- */
  main{flex:1;display:grid;grid-template-columns:352px minmax(0,1fr);min-height:0}
  .list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
    background:var(--surface)}
  .listhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
  .search{position:relative}
  .search input{width:100%;border:1px solid var(--line);background:var(--surface2);
    border-radius:8px;padding:7px 9px 7px 28px;font:12px inherit;color:var(--ink);font-family:inherit}
  .search input:focus{outline:none;border-color:var(--green2);background:#fff}
  .search span{position:absolute;left:9px;top:6px;color:var(--faint);font-size:12px}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;
    padding:3px 9px;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .chip b{font-weight:600;color:var(--ink);margin-left:2px;font-variant-numeric:tabular-nums}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .chip.on b{color:#fff}
  .chip.low{color:#7A5322;border-color:#E6D3B2;background:#FAF2E4}
  .chip.low.on{background:var(--amber);border-color:var(--amber);color:#fff}
  .rows{overflow-y:auto;flex:1;min-height:0;padding:7px 8px 16px}
  .rows::-webkit-scrollbar{width:10px}
  .rows::-webkit-scrollbar-thumb{background:#D8CDB8;border-radius:6px;border:3px solid var(--surface)}
  .row{display:grid;grid-template-columns:30px 8px minmax(0,1fr) auto;gap:7px;align-items:start;
    padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .row:hover{background:var(--surface2)}
  .row.sel{background:#EDF3EF;border-color:#BFD6CA}
  .row.playing{background:var(--mint)}
  .row.low{border-left:3px solid var(--amber);padding-left:6px}
  .row .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right;padding-top:1px}
  .row.sel .n{color:var(--green)}
  .row .dot{width:7px;height:7px;border-radius:50%;margin-top:5px}
  .row .txt{min-width:0}
  .row .txt p{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:12.5px;
    line-height:1.42;color:#2A302B;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row.sel .txt p{color:var(--ink)}
  .row .txt .who{font-family:-apple-system,"Segoe UI",sans-serif;font-size:9.5px;color:var(--faint);
    letter-spacing:.2px;margin-top:2px}
  .row .rt{text-align:right;font-family:var(--mono);font-size:9.5px;color:var(--faint);
    padding-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .row .rt b{display:block;font-weight:400;color:var(--muted)}
  .row .rt .cf{display:inline-block;margin-top:3px;font-size:8.5px;padding:0 4px;border-radius:99px;
    background:#E7F0EB;color:#1E4A3D}
  .row .rt .cf.mid{background:#F7EBD8;color:#7A5322}
  .row .rt .cf.bad{background:#F6E2DF;color:var(--red)}

  /* ---------- editor ---------- */
  .editor{overflow-y:auto;min-height:0;padding:22px 30px 34px;background:
    radial-gradient(1200px 300px at 20% -10%, #FAF7EF 0%, transparent 60%), var(--bg)}
  .ehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .idxbig{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .idxbig b{color:var(--green);font-size:14px}
  .who{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
  .who i{width:7px;height:7px;border-radius:50%}
  .conf{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--mint);color:#1E4A3D;
    font-family:var(--mono)}
  .conf.mid{background:#F7EBD8;color:#7A5322}
  .conf.bad{background:#F6E2DF;color:var(--red)}
  .editedtag{font-size:10px;color:#7A5322;background:#F7EBD8;border:1px solid #EAD6B4;
    border-radius:99px;padding:2px 8px;display:none}
  .editedtag.on{display:inline-block}
  .spacer{flex:1}
  .sentence{margin:14px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:24px;
    line-height:1.45;letter-spacing:.1px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:11px;padding:15px 17px;min-height:86px;
    outline:none;box-shadow:0 1px 0 rgba(60,45,20,.03)}
  .sentence:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(63,122,104,.10)}
  .sentence:empty:before{content:"（空句）";color:var(--faint)}
  .toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;color:var(--faint)}
  kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line2);border-bottom-width:2px;
    border-radius:4px;padding:1px 4px;background:var(--surface);color:var(--muted)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .field .lab{font-size:10px;letter-spacing:.8px;color:var(--faint);font-weight:700;text-transform:uppercase}
  .field .valrow{display:flex;align-items:center;gap:8px;margin-top:7px}
  .field input[type=text]{width:88px;border:1px solid var(--line);border-radius:7px;
    background:var(--surface2);padding:6px 8px;font-family:var(--mono);font-size:15px;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .field input:focus{outline:none;border-color:var(--green2);background:#fff}
  .field .unit{font-size:10.5px;color:var(--faint)}
  .nudge{display:flex;gap:4px;margin-left:auto}
  .nudge button{border:1px solid var(--line);background:var(--surface);border-radius:6px;
    width:34px;height:26px;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .nudge button:hover{border-color:var(--green2);color:var(--green)}
  .field .foot{margin-top:8px;font-size:10px;color:var(--faint);font-family:var(--mono)}

  .actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}
  .actions button{border:1px solid var(--line2);background:var(--surface);border-radius:8px;
    padding:7px 12px;font-size:11.5px;color:var(--ink)}
  .actions button:hover{border-color:var(--green);color:var(--green)}
  .actions .go{background:var(--green);border-color:var(--green);color:#fff;font-weight:600;padding:8px 15px}
  .actions .go:hover{background:#254b40;color:#fff}
  .actions .danger{margin-left:auto;color:var(--red);border-color:#E6C9C4}
  .actions .danger:hover{background:#FBF0EE;border-color:#D9A9A1;color:var(--red)}

  .asr{margin-top:22px}
  .asr h3{font-size:10px;letter-spacing:1.1px;color:var(--faint);font-weight:700;margin:0 0 8px;
    display:flex;align-items:center;gap:8px;text-transform:uppercase}
  .asr h3 span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint);font-size:10px}
  .words{display:flex;flex-wrap:wrap;gap:5px}
  .w{display:inline-flex;align-items:baseline;gap:5px;background:var(--surface);border:1px solid var(--line);
    border-radius:6px;padding:3px 7px;font-size:11px;color:#2A302B}
  .w em{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--faint)}
  .w.miss{border-style:dashed;color:var(--faint);background:transparent}
  .asr .note{margin-top:8px;font-size:10.5px;color:var(--faint);line-height:1.6}
  .asr .note b{color:var(--muted);font-weight:600}

  .statusbar{flex:0 0 26px;height:26px;display:flex;align-items:center;gap:14px;padding:0 20px;
    background:var(--surface);border-top:1px solid var(--line);font-size:9.5px;color:var(--faint);
    font-family:var(--mono);white-space:nowrap;overflow:hidden}
  .statusbar .g{color:var(--green)}
  .statusbar .r{margin-left:auto}

  @media (max-width:900px){
    main{grid-template-columns:1fr}
    .list{display:none}
    .ep,.stats{display:none}
    .now,.zoom{display:none}
    #loopBtn{display:none}
    .top{padding:0 12px;gap:8px}
    .top .btn:not(.primary){display:none}
    .transport{gap:8px;padding:0 12px}
    #eSpeakers{display:none}
    .statusbar{padding:0 12px}
    #sbHint,.statusbar .r{display:none}
    #wave{height:104px}
    .editor{padding:16px}
    .grid2{grid-template-columns:1fr}
    .sentence{font-size:20px}
    .brand .sub{display:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="mark">AA</span>AUDIO ALIGN<span class="slash">/</span><span class="sub">校对台</span></div>
  <div class="ep"><b id="title"></b><span id="epmeta"></span></div>
  <div class="stats">
    <span class="pill" id="statN"></span>
    <span class="pill ok" id="statConf"></span>
    <span class="pill warn" id="statLow"></span>
    <button class="btn" id="importBtn">导入 JSON</button>
    <button class="btn primary" id="exportBtn">导出 episode.json</button>
  </div>
</header>

<div class="transport">
  <button id="playBtn" title="空格：播放/暂停">▶</button>
  <div class="clock"><span id="cur">0:00.00</span> <em>/ <span id="dur">0:00.00</span></em></div>
  <div class="now" id="now"></div>
  <div class="tbtns">
    <select id="speed" title="播放速度">
      <option value="0.75">0.75×</option><option value="1" selected>1.0×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
    <button class="tbtn" id="loopBtn" title="单句循环">↻ 循环</button>
  </div>
  <div class="zoom">
    缩放
    <div class="seg" id="zoomSeg">
      <button data-z="1" class="on">适应</button><button data-z="2">2×</button><button data-z="4">4×</button>
    </div>
  </div>
</div>

<div class="wavewrap">
  <canvas id="wave"></canvas>
  <div class="wavemeta">
    <div class="legend" id="legend"><span class="hint">单击波形定位 · 拖动选中句的绿色边缘修改边界</span></div>
    <div class="right" id="waveinfo"></div>
  </div>
</div>

<main>
  <aside class="list">
    <div class="listhead">
      <div class="search"><span>⌕</span><input id="q" placeholder="搜索句子、说话人…"></div>
      <div class="chips" id="chips">
        <button class="chip on" data-f="all">全部 <b id="cAll"></b></button>
        <button class="chip low" data-f="low">待校对 <b id="cLow"></b></button>
        <button class="chip" data-f="edited">已改 <b id="cEdit"></b></button>
      </div>
    </div>
    <div class="rows" id="rows"></div>
  </aside>

  <section class="editor">
    <div class="ehead">
      <div class="idxbig">第 <b id="eIdx">12</b> 句 <span id="eTotal">/ 76</span></div>
      <span class="who" id="eWho"><i></i><span></span></span>
      <span class="conf" id="eConf"></span>
      <span class="editedtag" id="eEdited">已手动修改</span>
      <span class="spacer"></span>
      <span style="font-size:10px;color:var(--faint);font-family:var(--mono)" id="eSpeakers"></span>
    </div>

    <div class="sentence" id="eText" contenteditable="true" spellcheck="false"></div>
    <div class="toolrow">
      文本可直接修改，改动只作用于导出的 JSON · <kbd>↑</kbd><kbd>↓</kbd> 切换句子 · <kbd>Space</kbd> 播放
    </div>

    <div class="grid2">
      <div class="field">
        <div class="lab">起点 start</div>
        <div class="valrow">
          <input type="text" id="startIn" inputmode="decimal"><span class="unit">s</span>
          <div class="nudge">
            <button data-nudge="start-0.1">−0.1</button><button data-nudge="start+0.1">+0.1</button>
          </div>
        </div>
        <div class="foot" id="startFoot"></div>
      </div>
      <div class="field">
        <div class="lab">终点 end</div>
        <div class="valrow">
          <input type="text" id="endIn" inputmode="decimal"><span class="unit">s</span>
          <div class="nudge">
            <button data-nudge="end-0.1">−0.1</button><button data-nudge="end+0.1">+0.1</button>
          </div>
        </div>
        <div class="foot" id="endFoot"></div>
      </div>
    </div>

    <div class="actions">
      <button class="go" id="playSel">▶ 播放本句</button>
      <button id="retap">重打点（起点 = 当前播放位置）</button>
      <button id="delete">删除本句</button>
      <span class="spacer"></span>
      <button id="prev">← 上一句</button>
      <button id="next">下一句 →</button>
    </div>

    <div class="asr">
      <h3>ASR 词级时间戳 <span>对齐依据 · 只显示落在本句范围内的词</span></h3>
      <div class="words" id="words"></div>
      <div class="note" id="asrNote"></div>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span class="g" id="audioState">音频：ep.mp3 · 6:28.82</span>
  <span id="sbHint">单击波形或列表选句 · Space 播放 · [ ] 调起点 · ; ' 调终点</span>
  <span class="r">真实素材 mock · Why do people buy gold? · 76 句</span>
</footer>

<audio id="audio" src="../../data/gold/ep.mp3" preload="metadata"></audio>

<script src="data.js"></script>
<script>
const EP = window.EP;
const S = EP.sentences;
const COLORS = {
  "Georgie":"#2F5D50", "Phil":"#3E6E8E", "Catherine Schenk":"#A2653C",
  "John Reade":"#6A5A8E", "Suki Cooper":"#8A7A3B"
};
const colorOf = sp => COLORS[sp] || "#6B6355";

const $ = s => document.querySelector(s);
const audio = $('#audio');
const cv = $('#wave');
const ctx = cv.getContext('2d');

let sel = 12;
let filter = 'all';
let query = '';
let loop = false;
let zoom = 1;
let viewStart = 0;          // for zoom > 1, seconds
let stopAt = null;
let raf = null;
let dragEdge = null;
let dragging = false;

const fmt = t => {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + s.toFixed(2).padStart(5, '0');
};
const fmtShort = t => (+t).toFixed(2) + 's';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = s => Math.round((s.confidence || 0) * 100);
const confCls = c => c >= 0.8 ? '' : c >= 0.6 ? 'mid' : 'bad';
const visibleSentences = () => S.filter(s => {
  if (filter === 'low' && !s.needs_review) return false;
  if (filter === 'edited' && !s.edited) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return s.text.toLowerCase().includes(q) || (s.speaker || '').toLowerCase().includes(q);
});

/* ---------------- header / list ---------------- */
function refreshHeader(){
  $('#title').textContent = EP.title;
  $('#epmeta').textContent = EP.language.toUpperCase() + ' · ' + S.length + ' 句 · ' + fmt(EP.duration);
  $('#statN').textContent = S.length + ' 句';
  const mean = S.length ? S.reduce((a, s) => a + (s.confidence || 0), 0) / S.length : 0;
  $('#statConf').textContent = '平均 ' + (mean * 100).toFixed(1) + '%';
  const low = S.filter(s => s.needs_review).length;
  const ed = S.filter(s => s.edited).length;
  $('#statLow').textContent = '待校对 ' + low + ' 句';
  $('#statLow').classList.toggle('warn', low > 0);
  $('#statLow').classList.toggle('ok', low === 0);
  $('#cAll').textContent = S.length;
  $('#cLow').textContent = low;
  $('#cEdit').textContent = ed;
  $('#eTotal').textContent = '/ ' + S.length;
  $('#eSpeakers').textContent = [...new Set(S.map(s => s.speaker))].filter(Boolean).join(' · ');
}

function renderRows(){
  const vis = visibleSentences();
  $('#rows').innerHTML = vis.map(s => {
    const cls = ['row'];
    if (s.i === sel) cls.push('sel');
    if (audio && !audio.paused && stopAt != null && s.i === sel) cls.push('playing');
    if (s.needs_review) cls.push('low');
    return `<div class="${cls.join(' ')}" data-i="${s.i}" role="button" tabindex="-1">
      <div class="n">${String(s.i + 1).padStart(2, '0')}</div>
      <div class="dot" style="background:${colorOf(s.speaker)}"></div>
      <div class="txt"><p>${esc(s.text)}</p><div class="who">${esc(s.speaker || '—')}${s.edited ? ' · 已改' : ''}</div></div>
      <div class="rt"><b>${fmt(s.start)}</b><b>${fmt(s.end)}</b><span class="cf ${confCls(s.confidence)}">${pct(s)}%</span></div>
    </div>`;
  }).join('');
  const el = $('#rows .row.sel');
  if (el) el.scrollIntoView({block:'nearest'});
}

/* ---------------- waveform ---------------- */
function waveX(t, w){ return ((t - viewStart) / (EP.duration / zoom)) * w; }
function drawWave(){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#F8F5EC'; ctx.fillRect(0, 0, w, h);

  const span = EP.duration / zoom;
  const mid = h * 0.46;
  const amp = h * 0.34;

  // sentence bands
  S.forEach(s => {
    const x0 = waveX(s.start, w), x1 = waveX(s.end, w);
    if (x1 < 0 || x0 > w) return;
    ctx.fillStyle = hexA(colorOf(s.speaker), s.i === sel ? 0.20 : 0.085);
    ctx.fillRect(x0, 6, Math.max(1, x1 - x0), h - 24);
  });

  // baseline + peaks
  ctx.strokeStyle = '#E7DDCB'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

  const peaks = zoom > 1 ? (EP.peaksHi || EP.peaks) : EP.peaks, n = peaks.length;
  const first = Math.max(0, Math.floor(viewStart / EP.duration * n));
  const last = Math.min(n, Math.ceil((viewStart + span) / EP.duration * n));
  ctx.strokeStyle = 'rgba(47,93,80,.72)';
  ctx.lineWidth = Math.max(1, (w / (last - first)) * 0.72);
  ctx.beginPath();
  for (let i = first; i < last; i++) {
    const x = ((i / n) * EP.duration - viewStart) / span * w;
    const a = Math.max(0.012, peaks[i]) * amp;
    ctx.moveTo(x, mid - a); ctx.lineTo(x, mid + a);
  }
  ctx.stroke();

  // selection outline + handles
  const s = S[sel];
  if (s) {
    const x0 = waveX(s.start, w), x1 = Math.max(waveX(s.end, w), x0 + 2);
    ctx.strokeStyle = '#2F5D50'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x0 + .5, 6.5, Math.max(2, x1 - x0 - 1), h - 25);
    ctx.fillStyle = '#2F5D50';
    [[x0, 6], [x0, h - 19], [x1, 6], [x1, h - 19]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.roundRect(x - 3, y, 6, 13, 2); ctx.fill();
    });
    ctx.fillStyle = '#2F5D50'; ctx.font = '600 9px ui-monospace,Consolas';
    ctx.fillText(fmt(s.start), Math.min(x0 + 4, w - 46), 18);
  }

  // playhead
  if (audio && audio.currentTime >= viewStart && audio.currentTime <= viewStart + span) {
    const px = waveX(audio.currentTime, w);
    ctx.strokeStyle = '#C6863C'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px, 4); ctx.lineTo(px, h - 18); ctx.stroke();
    ctx.fillStyle = '#C6863C';
    ctx.beginPath(); ctx.moveTo(px - 4, 4); ctx.lineTo(px + 4, 4); ctx.lineTo(px, 10); ctx.fill();
  }

  // ruler
  ctx.fillStyle = '#9A917F'; ctx.font = '9.5px ui-monospace,Consolas';
  const step = zoom >= 4 ? 15 : zoom >= 2 ? 30 : 60;
  for (let t = Math.ceil(viewStart / step) * step; t < viewStart + span; t += step) {
    const x = waveX(t, w);
    ctx.strokeStyle = '#ECE3D2'; ctx.beginPath(); ctx.moveTo(x, h - 16); ctx.lineTo(x, h - 12); ctx.stroke();
    ctx.fillText(Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'), x + 4, h - 3);
  }

  $('#waveinfo').textContent =
    '窗口 ' + fmt(viewStart) + ' – ' + fmt(Math.min(EP.duration, viewStart + span)) +
    ' · ' + zoom + '× · 采样 ' + peaks.length + ' 点';
}

function hexA(hex, a){
  const h = hex.replace('#', '');
  const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(v.slice(0, 2), 16), g = parseInt(v.slice(2, 4), 16), b = parseInt(v.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------------- editor ---------------- */
function updateEditor(){
  const s = S[sel];
  if (!s) return;
  $('#eIdx').textContent = sel + 1;
  const who = $('#eWho');
  who.querySelector('i').style.background = colorOf(s.speaker);
  who.querySelector('span').textContent = s.speaker || '—';
  const c = $('#eConf');
  c.textContent = '置信度 ' + pct(s) + '%';
  c.className = 'conf ' + confCls(s.confidence);
  $('#eEdited').classList.toggle('on', !!s.edited);
  $('#eText').textContent = s.text;
  $('#startIn').value = s.start.toFixed(2);
  $('#endIn').value = s.end.toFixed(2);
  $('#startFoot').textContent = fmt(s.start) + ' · 首词 ' +
    (wordIn(s, 'first') ? wordIn(s, 'first').start.toFixed(2) + 's' : '—');
  $('#endFoot').textContent = fmt(s.end) + ' · 末词 ' +
    (wordIn(s, 'last') ? wordIn(s, 'last').end.toFixed(2) + 's' : '—');
  $('#now').innerHTML = `第 <b>${sel + 1}</b> 句 · ${esc(s.speaker || '')} · ${fmt(s.start)}–${fmt(s.end)}`;
  renderWords(s);
  if (s.i === sel) drawWave();
}

function wordIn(s, which){
  const ws = EP.words.filter(w => w.start >= s.start - 0.5 && w.end <= s.end + 0.25);
  return which === 'first' ? ws[0] : ws[ws.length - 1];
}

function renderWords(s){
  const ws = EP.words.filter(w => w.end > s.start - 0.15 && w.start < s.end + 0.15);
  const total = s.text.split(/\s+/).filter(Boolean).length;
  const shown = ws.slice(0, 48);
  $('#words').innerHTML = shown.map(w =>
    `<span class="w">${esc(w.word)}<em>${w.start.toFixed(2)}</em></span>`).join('') +
    (ws.length > 48 ? `<span class="w miss">+${ws.length - 48} 词</span>` : '');
  $('#asrNote').innerHTML = `<b>${ws.length}</b> 个 ASR 词落在本句区间 · 文稿 <b>${total}</b> 词 · ` +
    `置信度 = 命中文稿 token / 全部 token（${Math.round((s.confidence || 0) * 100)}%）`;
}

function selectSentence(i, scroll){
  if (i < 0 || i >= S.length) return;
  sel = i;
  if (zoom > 1) viewStart = Math.max(0, S[i].start - (EP.duration / zoom) * 0.35);
  renderRows(); updateEditor();
  if (scroll) {
    const row = $('#rows .row[data-i="' + i + '"]');
    if (row) row.scrollIntoView({block:'center'});
  }
}

/* ---------------- audio ---------------- */
function playAt(i){
  const s = S[i];
  if (!s) return;
  selectSentence(i, false);
  stopAt = s.end;
  const go = () => {
    audio.currentTime = Math.max(0, s.start);
    audio.play().catch(err => { $('#audioState').textContent = '播放失败：' + err.message; });
    tick();
  };
  if (audio.readyState >= 1) go();
  else audio.addEventListener('loadedmetadata', go, {once:true});
}
function tick(){
  cancelAnimationFrame(raf);
  const step = () => {
    if (audio.paused || stopAt == null) return;
    if (audio.currentTime >= stopAt - 0.01) {
      if (loop) { audio.currentTime = S[sel].start; audio.play(); raf = requestAnimationFrame(step); return; }
      audio.pause(); stopAt = null; return;
    }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
audio.addEventListener('play', () => { $('#playBtn').textContent = '❚❚'; tick(); drawWave(); });
audio.addEventListener('pause', () => { $('#playBtn').textContent = '▶'; drawWave(); });
audio.addEventListener('timeupdate', () => {
  $('#cur').textContent = fmt(audio.currentTime);
  if (stopAt != null && audio.currentTime >= stopAt - 0.02) { audio.pause(); stopAt = null; }
  drawWave();
});
audio.addEventListener('loadedmetadata', () => {
  $('#dur').textContent = fmt(audio.duration || EP.duration);
  $('#audioState').textContent = '音频已加载 · ' + (audio.duration || EP.duration).toFixed(3) + 's';
});
audio.addEventListener('error', () => {
  $('#audioState').textContent = '音频未加载（mock 目录相对路径）';
});
$('#speed').addEventListener('change', e => { audio.playbackRate = parseFloat(e.target.value); });

/* ---------------- interactions ---------------- */
$('#rows').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row) { selectSentence(Number(row.dataset.i), false); playAt(Number(row.dataset.i)); }
});
$('#q').addEventListener('input', e => { query = e.target.value.trim(); renderRows(); });
$('#chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  filter = chip.dataset.f;
  [...$('#chips').children].forEach(c => c.classList.toggle('on', c === chip));
  renderRows();
});

$('#playBtn').addEventListener('click', () => {
  if (!audio.paused) { audio.pause(); return; }
  playAt(sel);
});
$('#playSel').addEventListener('click', () => playAt(sel));
$('#loopBtn').addEventListener('click', () => {
  loop = !loop;
  $('#loopBtn').classList.toggle('on', loop);
  $('#loopBtn').textContent = loop ? '↻ 循环中' : '↻ 循环';
});
$('#prev').addEventListener('click', () => selectSentence(Math.max(0, sel - 1), true));
$('#next').addEventListener('click', () => selectSentence(Math.min(S.length - 1, sel + 1), true));

$('#eText').addEventListener('input', () => {
  const s = S[sel];
  s.text = $('#eText').innerText.trim();
  s.edited = true;
  $('#eEdited').classList.add('on');
  const row = $('#rows .row[data-i="' + sel + '"]');
  if (row) { row.querySelector('.txt p').textContent = s.text; }
  refreshHeader();
});
$('#eText').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('#eText').blur(); }
});

function nudge(field, d){
  const s = S[sel];
  s[field] = Math.max(0, +(s[field] + d).toFixed(3));
  if (s.end <= s.start + 0.05) s.end = +(s.start + 0.15).toFixed(3);
  s.edited = true;
  if (field === 'end' && stopAt != null) stopAt = s.end;
  renderRows(); updateEditor(); refreshHeader();
}
document.querySelectorAll('[data-nudge]').forEach(b => b.addEventListener('click', () => {
  const [f, d] = b.dataset.nudge.split(/(?=[+-])/);
  nudge(f, parseFloat(d));
}));
function commitInput(field, el){
  const v = parseFloat(el.value);
  if (!isFinite(v)) { updateEditor(); return; }
  const s = S[sel];
  s[field] = Math.max(0, +v.toFixed(3));
  if (s.end <= s.start + 0.05) s.end = +(s.start + 0.15).toFixed(3);
  s.edited = true;
  renderRows(); updateEditor(); refreshHeader();
}
$('#startIn').addEventListener('change', e => commitInput('start', e.target));
$('#endIn').addEventListener('change', e => commitInput('end', e.target));

$('#retap').addEventListener('click', () => {
  const s = S[sel], next = S[sel + 1], now = audio.currentTime || s.start;
  s.start = +now.toFixed(3);
  s.end = next && next.start > now + 0.2 ? +(next.start - 0.05).toFixed(3)
                                        : +Math.min(audio.duration || now + 3, now + 3).toFixed(3);
  s.edited = true; stopAt = s.end;
  renderRows(); updateEditor(); refreshHeader();
});
$('#delete').addEventListener('click', () => {
  if (!confirm('删除这一句？导出后才会写回 JSON。')) return;
  S.splice(sel, 1);
  S.forEach((s, k) => { s.i = k; });
  sel = Math.min(sel, S.length - 1);
  refreshHeader(); renderRows(); updateEditor(); drawWave();
});

$('#zoomSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  zoom = Number(b.dataset.z);
  [...$('#zoomSeg').children].forEach(x => x.classList.toggle('on', x === b));
  viewStart = zoom === 1 ? 0 : Math.max(0, S[sel].start - (EP.duration / zoom) * 0.35);
  drawWave();
});

// wave click: seek + select; drag selected edges
function timeAt(ev){
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width;
  return Math.max(0, Math.min(EP.duration, viewStart + x * EP.duration / zoom));
}
cv.addEventListener('pointerdown', e => {
  const s = S[sel];
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left;
  const x0 = waveX(s.start, r.width), x1 = waveX(s.end, r.width);
  if (Math.abs(x - x0) < 6) { dragEdge = 'start'; dragging = true; cv.setPointerCapture(e.pointerId); return; }
  if (Math.abs(x - x1) < 6) { dragEdge = 'end'; dragging = true; cv.setPointerCapture(e.pointerId); return; }
  const t = timeAt(e);
  const hit = S.find(q => t >= q.start && t <= q.end) || S[Math.max(0, S.length - 1)];
  selectSentence(hit.i, true);
  audio.currentTime = t;
  drawWave();
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const s = S[sel], t = timeAt(e);
  if (dragEdge === 'start') s.start = Math.min(+t.toFixed(3), +(s.end - 0.15).toFixed(3));
  else s.end = Math.max(+t.toFixed(3), +(s.start + 0.15).toFixed(3));
  s.edited = true;
  renderRows(); updateEditor(); refreshHeader();
});
cv.addEventListener('pointerup', () => { dragging = false; dragEdge = null; });
cv.addEventListener('pointerleave', () => { if (dragging) { dragging = false; dragEdge = null; } });

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.target.isContentEditable) return;
  if (e.code === 'Space') { e.preventDefault(); audio.paused ? playAt(sel) : audio.pause(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); selectSentence(Math.min(S.length - 1, sel + 1), true); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); selectSentence(Math.max(0, sel - 1), true); }
  else if (e.key === '[') nudge('start', -0.1);
  else if (e.key === ']') nudge('start', 0.1);
  else if (e.key === ';') nudge('end', -0.1);
  else if (e.key === "'") nudge('end', 0.1);
  else if (e.key === 'Enter') playAt(sel);
});

$('#exportBtn').addEventListener('click', () => {
  const data = {
    version: 1, title: EP.title, audio: '../../data/gold/ep.mp3', duration: EP.duration,
    language: EP.language, model: EP.model,
    generated_at: new Date().toISOString(),
    stats: {
      sentences: S.length,
      low_confidence: S.filter(s => s.needs_review).length,
      mean_confidence: Math.round(S.reduce((a, s) => a + (s.confidence || 0), 0) / S.length * 1000) / 1000
    },
    sentences: S.map((s, i) => ({ i, speaker: s.speaker, text: s.text, start: s.start, end: s.end,
      confidence: s.confidence, needs_review: s.needs_review, ...(s.edited ? {edited: true} : {}) }))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'episode.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});
$('#importBtn').addEventListener('click', () => alert('原型：生产版这里读取本地 episode.json 覆盖当前草稿。'));

// keep canvas crisp on resize
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawWave, 80); });

refreshHeader();
renderRows();
updateEditor();
drawWave();
$('#dur').textContent = fmt(EP.duration);
$('#eText').focus();
</script>
</body>
</html>
