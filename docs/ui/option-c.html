<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 C · 沉浸精读稿</title>
<style>
  :root{
    --paper:#F6F1E6; --paper2:#EFE8D8; --surface:#FFFCF5; --ink:#20261F;
    --muted:#635C4E; --faint:#9A917F; --line:#E0D3BC; --line2:#D3C4A8;
    --green:#2F5D50; --green2:#3F7A68; --mint:#DFEDE6; --amber:#C6863C;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font:14px/1.5 -apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--green2);outline-offset:2px}

  .topline{position:fixed;top:0;left:0;right:0;height:3px;background:#E6DDCB;z-index:60}
  .topline i{display:block;height:100%;background:var(--green);width:20%}

  .mast{position:sticky;top:0;z-index:50;height:58px;display:flex;align-items:center;gap:14px;
    padding:0 26px;background:rgba(246,241,230,.975);border-bottom:1px solid rgba(224,211,188,.85);
    backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:1.6px;
    color:var(--green);white-space:nowrap}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:9px;letter-spacing:0}
  .brand .sub{color:var(--ink);font-weight:600;letter-spacing:.5px}
  .mast .mtitle{flex:1;min-width:0;font-family:Georgia,"Noto Serif SC",serif;font-size:14px;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mast .right{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .mast .pos{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .mast .pos b{color:var(--ink);font-weight:600}
  .mbtn{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:5px 11px;
    font-size:11px;color:var(--muted)}
  .mbtn:hover{border-color:var(--green);color:var(--green)}
  .mbtn.on{background:var(--green);border-color:var(--green);color:#fff}

  main{padding:38px 0 150px}
  .head{max-width:760px;margin:0 auto;padding:0 30px}
  .kicker{font-size:9.5px;letter-spacing:2px;color:var(--amber);font-weight:800}
  h1{font-family:Georgia,"Noto Serif SC",serif;font-size:40px;line-height:1.18;font-weight:600;
    letter-spacing:-.4px;margin:9px 0 12px;color:#1D231E}
  .meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:10.5px;color:var(--faint);
    letter-spacing:.3px}
  .meta .names{color:var(--muted)}
  .meta i{width:2px;height:2px;border-radius:50%;background:var(--faint);display:inline-block}
  .head .rule{height:1px;background:linear-gradient(90deg,var(--line2),rgba(211,196,168,0));
    margin:20px 0 0}

  .article{max-width:760px;margin:0 auto;padding:6px 30px 0}
  .turn{display:grid;grid-template-columns:92px minmax(0,1fr);gap:18px;padding:18px 0 4px}
  .turn + .turn{border-top:1px solid rgba(224,211,188,.55);margin-top:8px;padding-top:20px}
  .gutter{text-align:right;padding-top:5px}
  .gutter .who{display:block;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
  .gutter .tt{display:block;font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:4px}
  .para{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.92;
    letter-spacing:.05px;color:#252B25;text-wrap:pretty}
  .s{cursor:pointer;border-radius:3px;padding:1px 2px;margin:0 -1px;transition:background .12s;
    box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .s:hover{background:#EDE5D3}
  .s.cur{background:var(--mint);box-shadow:0 0 0 4px var(--mint)}
  .s.cur:before{content:"▸";color:var(--green);font-family:-apple-system,sans-serif;font-size:11px;
    margin-right:5px;vertical-align:2px}
  .s .tag{display:none;font-family:var(--mono);font-size:9px;color:var(--faint);margin-left:6px;
    vertical-align:3px;white-space:nowrap}
  body.edit .s .tag{display:inline}
  body.edit .s{border-bottom:1px dotted #D8CBB2}
  body:after{content:"";position:fixed;left:0;right:0;bottom:0;height:118px;pointer-events:none;
    background:linear-gradient(rgba(246,241,230,0),var(--paper) 72%);z-index:54}

  .fin{max-width:760px;margin:26px auto 0;padding:0 30px;font-size:10.5px;color:var(--faint);
    display:flex;align-items:center;gap:10px}
  .fin .line{flex:1;height:1px;background:var(--line)}

  /* ---------- player ---------- */
  .player{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:55;
    width:min(780px,calc(100% - 40px));min-height:68px;display:flex;align-items:center;gap:12px;
    padding:10px 14px;border-radius:18px;background:rgba(255,252,245,.94);
    border:1px solid var(--line2);box-shadow:0 16px 40px rgba(64,48,22,.16),0 2px 6px rgba(64,48,22,.06);
    backdrop-filter:blur(12px);flex-wrap:wrap;transition:border-radius .15s}
  #playBtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--green);color:#fff;
    font-size:13px;display:grid;place-items:center;flex:0 0 44px;box-shadow:0 4px 12px rgba(47,93,80,.28)}
  #playBtn:hover{background:#254b40}
  .pmeta{flex:0 0 auto;min-width:104px}
  .pmeta .l1{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .pmeta .l1 b{color:var(--ink);font-weight:600}
  .pmeta .l2{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:3px;white-space:nowrap}
  .ptrack{flex:1;min-width:120px;height:22px;display:flex;align-items:center;position:relative;cursor:pointer}
  .ptrack .rail{position:absolute;left:0;right:0;height:4px;border-radius:99px;background:#E6DDCB;overflow:hidden}
  .ptrack .fill{height:100%;background:var(--green);width:0}
  .ptrack .ticks{position:absolute;left:0;right:0;height:12px;top:5px;opacity:.5;pointer-events:none}
  .ptrack .ticks i{position:absolute;top:6px;width:1px;height:4px;background:#B9AC94}
  .ptrack .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--green);
    border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);left:0;top:6px;transform:translateX(-5px)}
  .pctl{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .pctl button{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:7px;
    font-size:14px;display:grid;place-items:center}
  .pctl button:hover{background:var(--paper2);color:var(--ink)}
  select{border:1px solid var(--line);background:transparent;border-radius:7px;padding:4px 4px;
    font-size:10px;color:var(--muted);font-family:inherit}
  .editrow{display:none;width:100%;align-items:center;gap:7px;flex-wrap:wrap;
    border-top:1px solid rgba(224,211,188,.8);margin-top:2px;padding-top:8px;font-size:10px;color:var(--faint)}
  body.edit .editrow{display:flex}
  body.edit .player{border-radius:16px}
  .er-group{display:flex;align-items:center;gap:4px}
  .er-group span{font-weight:700;letter-spacing:.5px;font-size:9px}
  .er-group input{width:62px;border:1px solid var(--line);border-radius:6px;background:#fff;
    padding:4px 6px;font-family:var(--mono);font-size:11px;color:var(--ink)}
  .er-group input:focus{outline:none;border-color:var(--green2)}
  .er-group button{border:1px solid var(--line);background:#fff;border-radius:5px;width:28px;height:23px;
    font-family:var(--mono);font-size:9px;color:var(--muted)}
  .editrow .ghost{border:1px solid var(--line2);background:transparent;border-radius:7px;padding:4px 9px;
    font-size:10px;color:var(--muted)}
  .editrow .spacer{flex:1}

  @media (max-width:760px){
    .mast{padding:0 14px;gap:8px}
    .mast .mtitle,.mast .pos,.brand .sub{display:none}
    h1{font-size:29px}
    main{padding-top:26px}
    .head,.article,.fin{padding-left:20px;padding-right:20px}
    .turn{grid-template-columns:1fr;gap:4px}
    .gutter{display:flex;align-items:baseline;gap:8px;text-align:left;padding:0}
    .gutter .tt{margin-top:0}
    .para{font-size:18px;line-height:1.85}
    .player{width:calc(100% - 16px);bottom:8px;gap:8px;padding:8px 10px}
    .pmeta{display:none}
    .pctl #editBtn{display:none}
    .pctl button{width:26px}
    body{padding-bottom:0}
  }
</style>
</head>
<body>

<div class="topline"><i id="progressTop"></i></div>

<header class="mast">
  <div class="brand"><span class="mark">AA</span>AUDIO ALIGN <span class="sub">精读稿</span></div>
  <div class="mtitle" id="mTitle"></div>
  <div class="right">
    <span class="pos">第 <b id="mIdx">16</b> / <span id="mTotal">76</span> 句</span>
    <button class="mbtn" id="editBtn">编辑</button>
    <button class="mbtn" id="exportBtn">导出</button>
  </div>
</header>

<main>
  <div class="head">
    <div class="kicker">AUDIO ALIGN · 精读稿</div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="rule"></div>
  </div>

  <div class="article" id="article"></div>

  <div class="fin"><span class="line"></span><span id="finText"></span><span class="line"></span></div>
</main>

<div class="player" id="player">
  <button id="playBtn" title="空格播放/暂停">▶</button>
  <div class="pmeta">
    <div class="l1" id="pLine">第 16 句 · Georgie</div>
    <div class="l2"><span id="pCur">0:00.00</span> / <span id="pDur">6:28.82</span></div>
  </div>
  <div class="ptrack" id="ptrack">
    <div class="rail"><div class="fill" id="pFill"></div></div>
    <div class="ticks" id="pTicks"></div>
    <div class="dot" id="pDot"></div>
  </div>
  <div class="pctl">
    <select id="speed">
      <option value="0.75">0.75×</option><option value="1" selected>1.0×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
    <button id="prev" title="上一句">‹</button>
    <button id="next" title="下一句">›</button>
    <button id="loop" title="单句循环">↻</button>
  </div>
  <div class="editrow">
    <div class="er-group"><span>起点</span><input id="startIn" inputmode="decimal">
      <button data-n="start-0.1">−.1</button><button data-n="start+0.1">+.1</button></div>
    <div class="er-group"><span>终点</span><input id="endIn" inputmode="decimal">
      <button data-n="end-0.1">−.1</button><button data-n="end+0.1">+.1</button></div>
    <button class="ghost" id="retap">重打点</button>
    <span class="spacer"></span>
    <span id="editHint">改动自动标记 edited · 导出时写回 JSON</span>
  </div>
</div>

<audio id="audio" src="../../data/gold/ep.mp3" preload="metadata"></audio>

<script src="data.js"></script>
<script>
const EP = window.EP, S = EP.sentences;
const COLORS = {"Georgie":"#2F5D50","Phil":"#3E6E8E","Catherine Schenk":"#A2653C",
  "John Reade":"#6A5A8E","Suki Cooper":"#8A7A3B"};
const colorOf = sp => COLORS[sp] || "#635C4E";
const $ = s => document.querySelector(s);
const audio = $('#audio');

let idx = 15;
let loop = false;
let stopAt = null;
let raf = null;
const hashM = location.hash.match(/^#s(\d+)$/i);
if (hashM) idx = Math.max(0, Math.min(S.length - 1, parseInt(hashM[1], 10) - 1));

const fmt = t => {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + s.toFixed(2).padStart(5, '0');
};
const pct = s => Math.round((s.confidence || 0) * 100);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- render article by speaker turns ---------- */
function renderArticle(){
  const turns = [];
  S.forEach(s => {
    const last = turns[turns.length - 1];
    if (!last || last.speaker !== s.speaker) turns.push({speaker: s.speaker, items: [s]});
    else last.items.push(s);
  });
  $('#article').innerHTML = turns.map(t => `
    <section class="turn">
      <div class="gutter"><span class="who" style="color:${colorOf(t.speaker)}">${esc(t.speaker || '—')}</span>
        <span class="tt">${fmt(t.items[0].start)}</span></div>
      <p class="para">${t.items.map(s => `<span class="s${s.i === idx ? ' cur' : ''}" data-i="${s.i}"
        title="${fmt(s.start)} – ${fmt(s.end)}">${esc(s.text)}<span class="tag">${s.start.toFixed(2)}</span></span>`).join(' ')}</p>
    </section>`).join('');
  $('#finText').textContent = '— 全文 ' + S.length + ' 句 · 平均对齐 ' +
    (S.reduce((a, s) => a + s.confidence, 0) / S.length * 100).toFixed(1) + '% —';
}

function renderHead(){
  $('#title').textContent = EP.title;
  $('#mTitle').textContent = EP.title;
  $('#mTotal').textContent = S.length;
  const speakers = [...new Set(S.map(s => s.speaker))].filter(Boolean);
  $('#meta').innerHTML = `<span class="names">${speakers.slice(0, 2).join(' · ')}${speakers.length > 2 ? ' +' + (speakers.length - 2) : ''}</span>
    <i></i><span>${fmt(EP.duration).slice(0, 4)}</span><i></i><span>${S.length} 句</span>
    <i></i><span>平均对齐 ${(S.reduce((a, s) => a + s.confidence, 0) / S.length * 100).toFixed(1)}%</span>`;
  $('#pDur').textContent = fmt(EP.duration);
  $('#pTicks').innerHTML = S.map(s => `<i style="left:${(s.start / EP.duration * 100).toFixed(3)}%"></i>`).join('');
}

function renderPlayer(){
  const s = S[idx];
  $('#pLine').textContent = '第 ' + (idx + 1) + ' 句 · ' + (s.speaker || '—');
  $('#mIdx').textContent = idx + 1;
  $('#startIn').value = s.start.toFixed(2);
  $('#endIn').value = s.end.toFixed(2);
  $('#progressTop').style.width = ((idx + 1) / S.length * 100).toFixed(1) + '%';
}

function paintPlayhead(){
  const t = audio.currentTime || S[idx].start;
  const p = Math.max(0, Math.min(1, t / EP.duration));
  $('#pFill').style.width = (p * 100).toFixed(2) + '%';
  $('#pDot').style.left = (p * 100).toFixed(2) + '%';
  $('#pCur').textContent = fmt(t);
}

function select(i, play){
  if (i < 0 || i >= S.length) return;
  idx = i;
  document.querySelectorAll('.s').forEach(el => el.classList.toggle('cur', Number(el.dataset.i) === i));
  renderPlayer();
  const cur = document.querySelector('.s.cur');
  if (cur) cur.scrollIntoView({block:'center', behavior:'auto'});
  if (play) playClip();
}

function playClip(){
  const s = S[idx];
  stopAt = s.end;
  const go = () => {
    audio.currentTime = Math.max(0, s.start);
    audio.play().catch(() => {});
    tick();
  };
  if (audio.readyState >= 1) go(); else audio.addEventListener('loadedmetadata', go, {once:true});
}
function tick(){
  cancelAnimationFrame(raf);
  const step = () => {
    if (audio.paused || stopAt == null) return;
    if (audio.currentTime >= stopAt - 0.01) {
      if (loop) { audio.currentTime = S[idx].start; audio.play(); raf = requestAnimationFrame(step); return; }
      audio.pause(); stopAt = null; return;
    }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

/* ---------- events ---------- */
$('#article').addEventListener('click', e => {
  const s = e.target.closest('.s');
  if (s) select(Number(s.dataset.i), true);
});
$('#playBtn').addEventListener('click', () => audio.paused ? playClip() : audio.pause());
$('#prev').addEventListener('click', () => select(Math.max(0, idx - 1), true));
$('#next').addEventListener('click', () => select(Math.min(S.length - 1, idx + 1), true));
$('#speed').addEventListener('change', e => { audio.playbackRate = parseFloat(e.target.value); });
$('#loop').addEventListener('click', () => {
  loop = !loop;
  $('#loop').style.color = loop ? 'var(--green)' : '';
  $('#loop').style.background = loop ? 'var(--mint)' : '';
});
$('#editBtn').addEventListener('click', () => {
  document.body.classList.toggle('edit');
  $('#editBtn').classList.toggle('on', document.body.classList.contains('edit'));
  $('#editBtn').textContent = document.body.classList.contains('edit') ? '完成' : '编辑';
});
$('#ptrack').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = Math.max(0, Math.min(EP.duration, (e.clientX - r.left) / r.width * EP.duration));
  paintPlayhead();
});
function nudge(field, d){
  const s = S[idx];
  s[field] = Math.max(0, +(s[field] + d).toFixed(3));
  if (s.end <= s.start + 0.05) s.end = +(s.start + 0.15).toFixed(3);
  s.edited = true;
  renderPlayer();
  const cur = document.querySelector('.s.cur');
  if (cur) cur.title = fmt(s.start) + ' – ' + fmt(s.end);
}
document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => {
  const [f, d] = b.dataset.n.split(/(?=[+-])/);
  nudge(f, parseFloat(d));
}));
function commit(field, el){
  const v = parseFloat(el.value);
  if (!isFinite(v)) { renderPlayer(); return; }
  const s = S[idx];
  s[field] = Math.max(0, +v.toFixed(3));
  if (s.end <= s.start + 0.05) s.end = +(s.start + 0.15).toFixed(3);
  s.edited = true;
  renderPlayer();
}
$('#startIn').addEventListener('change', e => commit('start', e.target));
$('#endIn').addEventListener('change', e => commit('end', e.target));
$('#retap').addEventListener('click', () => {
  const s = S[idx], next = S[idx + 1], now = audio.currentTime || s.start;
  s.start = +now.toFixed(3);
  s.end = next && next.start > now + 0.2 ? +(next.start - 0.05).toFixed(3)
                                        : +Math.min(audio.duration || now + 3, now + 3).toFixed(3);
  s.edited = true;
  renderPlayer();
});

audio.addEventListener('play', () => { $('#playBtn').textContent = '❚❚'; tick(); });
audio.addEventListener('pause', () => { $('#playBtn').textContent = '▶'; });
audio.addEventListener('timeupdate', paintPlayhead);
audio.addEventListener('loadedmetadata', paintPlayhead);

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.code === 'Space') { e.preventDefault(); audio.paused ? playClip() : audio.pause(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); select(Math.min(S.length - 1, idx + 1), true); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(Math.max(0, idx - 1), true); }
  else if (e.key === '[') nudge('start', -0.1);
  else if (e.key === ']') nudge('start', 0.1);
});

$('#exportBtn').addEventListener('click', () => {
  const data = {version:1, title:EP.title, audio:'../../data/gold/ep.mp3', duration:EP.duration,
    language:EP.language, model:EP.model, generated_at:new Date().toISOString(),
    stats:{sentences:S.length, low_confidence:S.filter(s=>s.needs_review).length,
      mean_confidence:Math.round(S.reduce((a,s)=>a+(s.confidence||0),0)/S.length*1000)/1000},
    sentences:S.map((s,i)=>({i, speaker:s.speaker, text:s.text, start:s.start, end:s.end,
      confidence:s.confidence, needs_review:s.needs_review, ...(s.edited?{edited:true}:{})}))};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='episode.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
});

renderHead(); renderArticle(); renderPlayer(); paintPlayhead();
requestAnimationFrame(() => {
  const cur = document.querySelector('.s.cur');
  if (cur) cur.scrollIntoView({block:'center', behavior:'auto'});
});
</script>
</body>
</html>
