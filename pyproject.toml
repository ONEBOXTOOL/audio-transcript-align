[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcript-align"
version = "0.1.0"
description = "Align an audio file and its transcript into sentence-level timestamps, JSON and a browser QA page."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "ONEBOXTOOL" }]
keywords = ["audio", "transcript", "alignment", "whisper", "subtitles", "dictation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # PyAV 19 removed metadata_errors; faster-whisper 1.2.1 would raise TypeError
    "faster-whisper>=1.2,<2",
    "av>=14,<19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["PySide6-Essentials>=6.6", "PySide6-Addons>=6.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
audio-align = "audio_align:main"

[tool.setuptools]
py-modules = ["audio_align"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
